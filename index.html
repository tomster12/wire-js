<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Wire.js</title>

		<script src="./wire.js"></script>
		<link rel="stylesheet" href="index.css" />
	</head>

	<script>
		const counter = new Wire.State("counter", 1);
		const multiplier = new Wire.State("multiplier", 2);
		const activity = new Wire.State("activity", []);
		const doubled = new Wire.Computed("doubled", [counter], (c) => c * 2);
		const multiplied = new Wire.Computed("multiplied", [counter, multiplier], (c, m) => c * m);
		const jsonState = new Wire.Computed("jsonState", [counter, multiplier, activity], (c, m, a) =>
			JSON.stringify({ counter: c, multiplier: m, activity: a }, null, 2),
		);

		function increment() {
			const next = counter.get() + 1;
			counter.set(next);
			activity.set([{ text: `Counter increased to ${next}` }, ...activity.get()]);
		}

		function changeMultiplier() {
			const next = multiplier.get() + 1;
			multiplier.set(next);
			activity.set([{ text: `Multiplier changed to ${next}` }, ...activity.get()]);
		}
	</script>

	<component name="metric-card" arg:title arg:value>
		<div class="card">
			<div>{{title}}</div>
			<div class="metric">{{value}}</div>
		</div>
	</component>

	<component name="feed-item" arg:text>
		<div class="feed-item">{{text}}</div>
	</component>

	<body style="padding: 20px">
		<h1 style="margin-bottom: 20px">Wire.js</h1>
		<div class="dashboard" style="margin-bottom: 20px">
			<component instance name="metric-card" arg:title="Counter" arg:value="@counter"></component>
			<component instance name="metric-card" arg:title="Doubled" arg:value="@doubled"></component>
			<component instance name="metric-card" arg:title="Multiplied" arg:value="@multiplied"></component>
		</div>

		<div style="display: flex; gap: 20px; margin: 40px 0">
			<button onclick="increment()">Increment Counter</button>
			<button onclick="changeMultiplier()">Increase Multiplier</button>
		</div>

		<h2 style="margin-bottom: 20px">Activity Feed</h2>
		<wire for="@activity" each="item" style="display: flex; flex-direction: column; gap: 5px">
			<component instance name="feed-item" arg:text="{{item.text}}"></component>
		</wire>

		<h2 style="margin-top: 40px; margin-bottom: 20px">State Inspector</h2>
		<pre><wire to="@jsonState"></wire></pre>
	</body>
</html>
